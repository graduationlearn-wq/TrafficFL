[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fedroad-traffic-fl"
version = "0.2.0"
description = "Federated deep learning for METR-LA traffic-speed forecasting with PyTorch and Flower"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "flwr[simulation]==1.42.0",
  "torch>=2.3.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "requests>=2.31.0",
  "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["fedroad"]

[tool.flwr.app]
publisher = "fedroad"

[tool.flwr.app.components]
serverapp = "fedroad.server_app:app"
clientapp = "fedroad.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
fraction-train = 1.0
fraction-evaluate = 1.0
local-epochs = 1
batch-size = 16
learning-rate = 0.001
num-clients = 4
max-train-windows = 1200
max-eval-windows = 1200
seed = 42

[tool.flwr.federations.local-simulation]
options.num-supernodes = 4
