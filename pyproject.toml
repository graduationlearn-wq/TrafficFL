[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fedroad-traffic-fl"
version = "0.2.0"
description = "Federated deep learning for METR-LA traffic-speed forecasting with PyTorch and Flower"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "flwr[simulation]==1.42.0",
  "torch>=2.3.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "requests>=2.31.0",
  "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
dashboard = ["streamlit>=1.40.0", "plotly>=5.20.0"]

[tool.hatch.build.targets.wheel]
packages = ["fedroad"]

[tool.flwr.app]
publisher = "fedroad"

[tool.flwr.app.components]
serverapp = "fedroad.server_app:app"
clientapp = "fedroad.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
fraction-train = 1.0
fraction-evaluate = 1.0
local-epochs = 1
batch-size = 64
learning-rate = 0.001
num-clients = 4
max-train-windows = 0
max-eval-windows = 0
seed = 42


#######################################################################
# CONFIGURATION MIGRATION NOTICE:
#
# What was previously called "federation config" for SuperLink
# connections in pyproject.toml has been renamed and moved.
#
# These settings are now **SuperLink connection configuration**
# and are defined in the Flower configuration file.
#
# The entries below are commented out intentionally and are kept
# only as a migration reference.
#
# Docs: https://flower.ai/docs/framework/ref-flower-configuration.html
